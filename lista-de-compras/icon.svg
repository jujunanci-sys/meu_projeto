<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="2.2" fill="#16161A" opacity=".08"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="#D6E9F8"/>
  <rect width="512" height="512" fill="url(#dots)"/>

  <g transform="translate(256 268) scale(1.15) translate(-256 -268)">
  <!-- sol (marca-texto) -->
  <circle cx="362" cy="158" r="44" fill="#FFE14D"/>

  <!-- livro rosa -->
  <g>
    <rect x="114" y="176" width="76" height="200" rx="9" fill="#F49AC1"/>
    <rect x="176" y="176" width="14" height="200" rx="4" fill="#000" opacity=".12"/>
    <rect x="114" y="326" width="76" height="5" fill="#16161A" opacity=".35"/>
    <rect x="114" y="337" width="76" height="5" fill="#16161A" opacity=".35"/>
  </g>
  <!-- livro oliva (mais alto) -->
  <g>
    <rect x="198" y="128" width="82" height="248" rx="9" fill="#C9C03A"/>
    <rect x="266" y="128" width="14" height="248" rx="4" fill="#000" opacity=".12"/>
    <rect x="198" y="326" width="82" height="5" fill="#16161A" opacity=".35"/>
    <rect x="198" y="337" width="82" height="5" fill="#16161A" opacity=".35"/>
  </g>
  <!-- livro vinho, inclinado -->
  <g transform="rotate(13 296 376)">
    <rect x="296" y="168" width="74" height="208" rx="9" fill="#A3182A"/>
    <rect x="356" y="168" width="14" height="208" rx="4" fill="#000" opacity=".15"/>
    <rect x="296" y="326" width="74" height="5" fill="#FFFDF8" opacity=".45"/>
    <rect x="296" y="337" width="74" height="5" fill="#FFFDF8" opacity=".45"/>
  </g>

  <!-- prateleira -->
  <rect x="100" y="372" width="300" height="30" rx="8" fill="#16161A"/>
  </g>
</svg>

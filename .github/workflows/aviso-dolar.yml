# Aviso do Dólar Hoje
# Consulta o dólar uma vez por minuto em dias úteis, das 9h às 18h (Brasília),
# e, se ele caiu desde a consulta anterior, manda uma notificação pelo app ntfy
# (funciona com o celular bloqueado e o app Dólar Hoje fechado).
#
# O GitHub só agenda tarefas a cada 5 minutos. Por isso cada tarefa fica ativa
# por ~9 minutos consultando a cada minuto, e a seguinte começa assim que ela
# termina: a vigia fica contínua mesmo quando o GitHub atrasa o agendamento.
name: Aviso do dólar

on:
  schedule:
    # 12h-20h59 UTC = 9h-17h59 em Brasília, segunda a sexta
    - cron: "*/5 12-20 * * 1-5"
  workflow_dispatch:
    inputs:
      teste:
        description: "Enviar uma notificação de teste agora"
        type: boolean
        default: false

concurrency:
  # As tarefas agendadas rodam uma de cada vez, em fila; as manuais rodam na hora.
  group: aviso-dolar-${{ github.event_name == 'schedule' && 'agenda' || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # Canal do ntfy. Para trocar sem deixar o nome público, crie o segredo
      # NTFY_TOPIC em Settings > Secrets and variables > Actions.
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'dolar-hoje-da76e9f76a45' }}
      APP_URL: https://jujunanci-sys.github.io/meu_projeto/dolar-app/
      TESTE: ${{ inputs.teste && '1' || '0' }}
      # Quanto tempo a tarefa fica vigiando (segundos). Manual: uma consulta só.
      DURACAO: ${{ github.event_name == 'schedule' && '540' || '0' }}
    steps:
      - name: Recuperar último preço
        uses: actions/cache/restore@v4
        with:
          path: .estado
          key: dolar-estado-${{ github.run_id }}
          restore-keys: dolar-estado-

      - name: Vigiar o dólar e avisar quando cair
        shell: python
        run: |
          import json, os, pathlib, time, urllib.request

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "dolar-hoje-aviso"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.load(r)

          def brl(v):
              s = f"{v:.4f}".rstrip("0")
              if len(s.split(".")[1]) < 2:
                  s = f"{v:.2f}"
              return "R$ " + s.replace(".", ",")

          def avisar(titulo, texto):
              corpo = json.dumps({
                  "topic": os.environ["NTFY_TOPIC"],
                  "title": titulo,
                  "message": texto,
                  "click": os.environ["APP_URL"],
              }).encode()
              req = urllib.request.Request("https://ntfy.sh/", data=corpo,
                                           headers={"Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      print("ntfy respondeu", r.status)
              except Exception as e:
                  print("ntfy falhou:", e)

          # Fontes que atualizam ao longo do dia. A comparação usa sempre a mesma
          # fonte da consulta anterior, para não gerar aviso falso ao trocar de fonte.
          def awesome():
              return float(get("https://economia.awesomeapi.com.br/json/last/USD-BRL")["USDBRL"]["bid"])

          def yahoo():
              d = get("https://query1.finance.yahoo.com/v8/finance/chart/BRL=X?interval=1m&range=1d")
              return float(d["chart"]["result"][0]["meta"]["regularMarketPrice"])

          estado = pathlib.Path(".estado/ultimo.json")
          salvo = json.loads(estado.read_text()) if estado.exists() else {}

          def consultar():
              fontes = [("yahoo", yahoo), ("awesome", awesome)]
              fontes.sort(key=lambda x: x[0] != salvo.get("fonte"))  # a fonte anterior primeiro
              for nome, f in fontes:
                  try:
                      return f(), nome
                  except Exception as e:
                      print(nome, "falhou:", e)
              return None, None

          def verificar():
              global salvo
              preco, fonte = consultar()
              if preco is None:
                  print("Sem cotação nesta consulta.")
                  return None
              anterior = salvo.get("preco") if salvo.get("fonte") == fonte else None
              print(time.strftime("%H:%M:%S"), "fonte:", fonte, "anterior:", anterior, "agora:", preco)
              if anterior is not None and preco < anterior - 1e-9:
                  avisar("O dólar caiu", f"Caiu {brl(anterior - preco)}: de {brl(anterior)} para {brl(preco)}.")
              salvo = {"preco": preco, "fonte": fonte}
              estado.parent.mkdir(exist_ok=True)
              estado.write_text(json.dumps(salvo))
              return preco

          inicio = time.time()
          duracao = int(os.environ.get("DURACAO", "0"))

          preco = verificar()
          if os.environ.get("TESTE") == "1":
              avisar("Dólar Hoje", f"Teste do aviso. Agora o dólar está {brl(preco)}." if preco else "Teste do aviso.")

          while time.time() - inicio + 60 <= duracao:
              time.sleep(60)
              verificar()

      - name: Guardar último preço
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .estado
          key: dolar-estado-${{ github.run_id }}

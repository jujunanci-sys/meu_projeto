<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minha Lista de Tarefas</title>
<style>
  :root {
    --bg: #f4f1ec; --card: #ffffff; --text: #2b2b2b; --muted: #8a8580;
    --line: #e7e2da; --accent: #6c63ff; --accent-soft: #ecebff;
    --alta: #e5534b; --media: #e0a33a; --baixa: #4caf7a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17161a; --card: #222127; --text: #eeeae4; --muted: #9b968f;
      --line: #34323a; --accent-soft: #2e2b4a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 32px 16px 64px; }
  header h1 { margin: 0; font-size: 28px; }
  header p { margin: 4px 0 20px; color: var(--muted); }

  .progress-card { background: var(--card); border-radius: 16px; padding: 16px;
    margin-bottom: 16px; border: 1px solid var(--line); }
  .progress-top { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; }
  .bar { height: 10px; background: var(--accent-soft); border-radius: 99px; overflow: hidden; }
  .bar span { display: block; height: 100%; width: 0; background: var(--accent);
    border-radius: 99px; transition: width .4s ease; }

  form { background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 12px; display: grid; gap: 8px; margin-bottom: 16px; }
  form .row { display: flex; gap: 8px; flex-wrap: wrap; }
  input, select, button { font: inherit; color: inherit; }
  input[type=text], input[type=date], select { background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; min-width: 0; }
  input[type=text] { width: 100%; }
  form .row > * { flex: 1 1 120px; }
  button.add { background: var(--accent); color: #fff; border: 0; border-radius: 10px;
    padding: 10px 16px; font-weight: 600; cursor: pointer; }

  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .filters button { background: transparent; border: 1px solid var(--line); border-radius: 99px;
    padding: 6px 14px; cursor: pointer; font-size: 14px; }
  .filters button.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  li { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px; display: flex; align-items: center; gap: 12px;
    border-left: 5px solid var(--p); animation: pop .2s ease; }
  @keyframes pop { from { transform: scale(.97); opacity: 0; } }
  li.done .title { text-decoration: line-through; color: var(--muted); }
  li .check { width: 22px; height: 22px; accent-color: var(--accent); flex: none; cursor: pointer; }
  li .info { flex: 1; min-width: 0; }
  li .title { overflow-wrap: anywhere; }
  li .meta { font-size: 12px; color: var(--muted); margin-top: 4px; display: flex; gap: 8px; flex-wrap: wrap; }
  li .tag { background: var(--accent-soft); border-radius: 6px; padding: 1px 8px; }
  li .late { color: var(--alta); font-weight: 600; }
  li .del { background: none; border: 0; color: var(--muted); font-size: 18px; cursor: pointer; padding: 4px; }
  li .del:hover { color: var(--alta); }
  .empty { text-align: center; color: var(--muted); padding: 32px 0; }
  .clear { margin-top: 16px; background: none; border: 0; color: var(--muted);
    text-decoration: underline; cursor: pointer; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Minhas tarefas ✨</h1>
    <p id="today"></p>
  </header>

  <div class="progress-card">
    <div class="progress-top"><strong>Progresso</strong><span id="count">0/0</span></div>
    <div class="bar"><span id="bar"></span></div>
  </div>

  <form id="form">
    <input type="text" id="title" placeholder="O que você precisa fazer?" required autocomplete="off">
    <div class="row">
      <select id="priority" aria-label="Prioridade">
        <option value="alta">🔴 Alta</option>
        <option value="media" selected>🟡 Média</option>
        <option value="baixa">🟢 Baixa</option>
      </select>
      <select id="category" aria-label="Categoria">
        <option>Pessoal</option><option>Trabalho</option><option>Estudos</option>
        <option>Casa</option><option>Saúde</option>
      </select>
      <input type="date" id="due" aria-label="Prazo">
      <button class="add" type="submit">Adicionar</button>
    </div>
  </form>

  <div class="filters" id="filters">
    <button data-f="todas" class="on">Todas</button>
    <button data-f="pendentes">Pendentes</button>
    <button data-f="concluidas">Concluídas</button>
    <button data-f="hoje">Hoje</button>
  </div>

  <ul id="list"></ul>
  <button class="clear" id="clear">Limpar concluídas</button>
</div>

<script>
  const KEY = 'todo-list-v1';
  const order = { alta: 0, media: 1, baixa: 2 };
  const colors = { alta: 'var(--alta)', media: 'var(--media)', baixa: 'var(--baixa)' };
  let filter = 'todas';
  let tasks = load();

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch {}
  }
  const todayStr = () => new Date().toLocaleDateString('en-CA');

  const hoje = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
  document.getElementById('today').textContent = hoje[0].toUpperCase() + hoje.slice(1);

  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();
    const title = document.getElementById('title');
    if (!title.value.trim()) return;
    tasks.push({
      id: Date.now(),
      title: title.value.trim(),
      priority: document.getElementById('priority').value,
      category: document.getElementById('category').value,
      due: document.getElementById('due').value,
      done: false,
    });
    title.value = '';
    title.focus();
    save(); render();
  });

  document.getElementById('filters').addEventListener('click', e => {
    if (!e.target.dataset.f) return;
    filter = e.target.dataset.f;
    document.querySelectorAll('#filters button').forEach(b => b.classList.toggle('on', b === e.target));
    render();
  });

  document.getElementById('clear').addEventListener('click', () => {
    tasks = tasks.filter(t => !t.done);
    save(); render();
  });

  function render() {
    const list = document.getElementById('list');
    const today = todayStr();
    const visible = tasks
      .filter(t => filter === 'todas' || (filter === 'pendentes' && !t.done) ||
        (filter === 'concluidas' && t.done) || (filter === 'hoje' && t.due === today))
      .sort((a, b) => a.done - b.done || order[a.priority] - order[b.priority] ||
        (a.due || '9999').localeCompare(b.due || '9999'));

    list.innerHTML = '';
    if (!visible.length) list.innerHTML = '<p class="empty">Nada por aqui 🎉</p>';

    for (const t of visible) {
      const li = document.createElement('li');
      li.className = t.done ? 'done' : '';
      li.style.setProperty('--p', colors[t.priority]);

      const check = document.createElement('input');
      check.type = 'checkbox'; check.className = 'check'; check.checked = t.done;
      check.addEventListener('change', () => { t.done = check.checked; save(); render(); });

      const info = document.createElement('div');
      info.className = 'info';
      const title = document.createElement('div');
      title.className = 'title'; title.textContent = t.title;
      const meta = document.createElement('div');
      meta.className = 'meta';
      const tag = document.createElement('span');
      tag.className = 'tag'; tag.textContent = t.category;
      meta.append(tag);
      if (t.due) {
        const d = document.createElement('span');
        const late = !t.done && t.due < today;
        d.className = late ? 'late' : '';
        d.textContent = (late ? '⚠ Atrasada · ' : '📅 ') +
          new Date(t.due + 'T00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' });
        meta.append(d);
      }
      info.append(title, meta);

      const del = document.createElement('button');
      del.className = 'del'; del.textContent = '✕'; del.setAttribute('aria-label', 'Excluir');
      del.addEventListener('click', () => { tasks = tasks.filter(x => x !== t); save(); render(); });

      li.append(check, info, del);
      list.append(li);
    }

    const done = tasks.filter(t => t.done).length;
    document.getElementById('count').textContent = `${done}/${tasks.length}`;
    document.getElementById('bar').style.width = tasks.length ? (done / tasks.length * 100) + '%' : '0';
  }

  render();
</script>
</body>
</html>

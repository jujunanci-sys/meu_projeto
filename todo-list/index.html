<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-do</title>
<style>
  :root {
    --glass: rgba(246, 245, 243, .72); --text: #5d5a56; --muted: #a5a19b;
    --line: rgba(0, 0, 0, .08); --tab-on: #fff; --hover: rgba(0, 0, 0, .04);
  }
  @media (prefers-color-scheme: dark) {
    :root { --glass: rgba(40, 39, 43, .72); --text: #dcd8d2; --muted: #85817b;
      --line: rgba(255, 255, 255, .1); --tab-on: rgba(255, 255, 255, .12); --hover: rgba(255, 255, 255, .05); }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: "Courier New", ui-monospace, Menlo, monospace; color: var(--text);
    background: linear-gradient(135deg, #d9c9b6, #8fa58a); display: grid; place-items: start center; }
  body.pip { background: var(--glass); display: block; }

  .widget { width: min(360px, calc(100vw - 32px)); margin: 48px 16px; padding: 14px 16px 16px;
    background: var(--glass); border: 1px solid var(--line); border-radius: 14px;
    backdrop-filter: blur(24px) saturate(1.4); -webkit-backdrop-filter: blur(24px) saturate(1.4);
    box-shadow: 0 12px 40px rgba(0, 0, 0, .15); font-size: 13px; }
  body.pip .widget { width: auto; margin: 0; min-height: 100vh; border: 0; border-radius: 0; box-shadow: none; }

  .top { display: flex; justify-content: center; position: relative; margin-bottom: 12px; }
  .date { color: var(--muted); font-size: 12px; }
  .pin { position: absolute; right: 0; top: -2px; background: none; border: 0; cursor: pointer;
    color: var(--muted); font: inherit; font-size: 13px; padding: 2px 4px; border-radius: 6px; }
  .pin:hover { background: var(--hover); color: var(--text); }

  .tabs { display: flex; gap: 2px; margin-bottom: 14px; }
  .tabs button { flex: 1; background: none; border: 0; font: inherit; font-size: 11px; color: var(--muted);
    padding: 5px 0; border-radius: 6px; cursor: pointer; }
  .tabs button.on { background: var(--tab-on); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, .06); }

  .group { margin-bottom: 12px; }
  .group h3 { margin: 0 0 4px; font-size: 12px; font-weight: 600; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 6px; padding: 3px 4px 3px 12px; border-radius: 6px; font-size: 12px; }
  li:hover { background: var(--hover); }
  li .t { flex: 1; overflow-wrap: anywhere; }
  .done .t, .cancelled .t { text-decoration: line-through; color: var(--muted); }
  li .acts { display: none; gap: 2px; }
  li:hover .acts, li:focus-within .acts { display: flex; }
  .acts button { background: none; border: 0; cursor: pointer; color: var(--muted); font: inherit;
    font-size: 12px; padding: 0 3px; }
  .acts button:hover { color: var(--text); }

  .empty { color: var(--muted); text-align: center; font-size: 12px; padding: 16px 0; }
  form { margin-top: 6px; border-top: 1px solid var(--line); padding-top: 10px; }
  form input { width: 100%; background: none; border: 0; outline: none; font: inherit; font-size: 12px; color: var(--text); }
  form input::placeholder { color: var(--muted); }
</style>
</head>
<body>
<div class="widget" id="widget">
  <div class="top">
    <span class="date" id="date"></span>
    <button class="pin" id="pin" title="Fixar por cima de todas as janelas">📌</button>
  </div>
  <div class="tabs" id="tabs">
    <button data-s="todo" class="on">To-do</button>
    <button data-s="pending">Pending</button>
    <button data-s="done">Completed</button>
    <button data-s="cancelled">Cancelled</button>
  </div>
  <div id="list"></div>
  <form id="form">
    <input id="input" placeholder="+ categoria: tarefa" title="Ex: work: weekly report" autocomplete="off">
  </form>
</div>

<script>
  const KEY = 'todo-widget-v1';
  const ACTIONS = {
    todo:      [['✓', 'done', 'Concluir'], ['⏸', 'pending', 'Mover para pendentes'], ['✕', 'cancelled', 'Cancelar']],
    pending:   [['✓', 'done', 'Concluir'], ['↺', 'todo', 'Voltar para to-do'], ['✕', 'cancelled', 'Cancelar']],
    done:      [['↺', 'todo', 'Voltar para to-do']],
    cancelled: [['↺', 'todo', 'Voltar para to-do']],
  };
  let tab = 'todo';
  let tasks = load();

  function load() {
    try {
      const saved = JSON.parse(localStorage.getItem(KEY));
      if (saved) return saved;
    } catch {}
    return [
      ['work', 'weekly report'], ['work', 'traffic analysis'],
      ['life', 'get groceries'], ['life', 'buy iphone duo cases'], ['life', 'book flight ticket 10/26'],
      ['content', 'organize raw clips'], ['study', 'Hw 6 - ddl 10/25'],
    ].map(([cat, text], i) => ({ id: i + 1, cat, text, status: 'todo' }));
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch {}
  }

  function showDate() {
    const d = new Date();
    const dia = d.toLocaleDateString('pt-BR', { day: 'numeric', month: 'long' });
    const sem = d.toLocaleDateString('pt-BR', { weekday: 'long' }).split('-')[0];
    document.getElementById('date').textContent = `${dia}, ${sem}`;
  }

  document.getElementById('tabs').addEventListener('click', e => {
    if (!e.target.dataset.s) return;
    tab = e.target.dataset.s;
    document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b === e.target));
    render();
  });

  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();
    const input = document.getElementById('input');
    const raw = input.value.trim();
    if (!raw) return;
    const m = raw.match(/^([^:]{1,24}):\s*(.+)$/);
    const cat = m ? m[1].trim().toLowerCase() : 'geral';
    tasks.push({ id: Date.now(), cat, text: m ? m[2] : raw, status: 'todo' });
    input.value = '';
    if (tab !== 'todo') document.querySelector('#tabs [data-s=todo]').click();
    save(); render();
  });

  function render() {
    const list = document.getElementById('list');
    list.innerHTML = '';
    const visible = tasks.filter(t => t.status === tab);
    if (!visible.length) {
      list.innerHTML = '<p class="empty">nada por aqui</p>';
      return;
    }
    const groups = new Map();
    for (const t of visible) {
      if (!groups.has(t.cat)) groups.set(t.cat, []);
      groups.get(t.cat).push(t);
    }
    for (const [cat, items] of groups) {
      const g = document.createElement('div');
      g.className = 'group';
      const h = document.createElement('h3');
      h.textContent = cat;
      const ul = document.createElement('ul');
      for (const t of items) {
        const li = document.createElement('li');
        li.className = t.status;
        const span = document.createElement('span');
        span.className = 't';
        span.textContent = t.text;
        const acts = document.createElement('span');
        acts.className = 'acts';
        for (const [icon, to, label] of ACTIONS[t.status]) {
          acts.append(button(icon, label, () => { t.status = to; save(); render(); }));
        }
        acts.append(button('🗑', 'Excluir', () => { tasks = tasks.filter(x => x !== t); save(); render(); }));
        li.append(span, acts);
        ul.append(li);
      }
      g.append(h, ul);
      list.append(g);
    }
  }

  function button(icon, label, onClick) {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = icon; b.title = label; b.setAttribute('aria-label', label);
    b.addEventListener('click', onClick);
    return b;
  }

  // Fixar: abre a lista numa janelinha que fica por cima de todos os apps (Chrome/Edge)
  document.getElementById('pin').addEventListener('click', async () => {
    if (!('documentPictureInPicture' in window)) {
      alert('Para fixar a lista por cima das outras janelas, abra esta página no Google Chrome ou no Microsoft Edge.');
      return;
    }
    const widget = document.getElementById('widget');
    const pip = await documentPictureInPicture.requestWindow({ width: 340, height: 460 });
    document.querySelectorAll('style').forEach(s => pip.document.head.append(s.cloneNode(true)));
    pip.document.title = 'To-do';
    pip.document.body.className = 'pip';
    pip.document.body.append(widget);
    document.getElementById('pin').hidden = true;
    pip.addEventListener('pagehide', () => {
      document.body.append(widget);
      document.getElementById('pin').hidden = false;
    });
  });

  showDate();
  setInterval(showDate, 60000);
  render();
</script>
</body>
</html>
